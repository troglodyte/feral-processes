  <!-- Row 2: Cranial visor plating -->
  <rect x="3" y="2" width="2" height="1" fill="#4338ca"/>
  <rect x="5" y="2" width="6" height="1" fill="#6366f1"/>
  <rect x="11" y="2" width="2" height="1" fill="#4338ca"/>

  <!-- Row 3: Shadow visor hood -->

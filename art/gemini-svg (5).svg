<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" width="256" height="256">
  <!-- Row 0: Uplink telemetry crown -->
  <rect x="5" y="0" width="1" height="1" fill="#818cf8"/>
  <rect x="10" y="0" width="1" height="1" fill="#818cf8"/>

  <!-- Row 1: Resonant field horns -->
  <rect x="4" y="1" width="2" height="1" fill="#c084fc"/>
  <rect x="7" y="1" width="2" height="1" fill="#e0e7ff"/>

[package]
name = "feral-processes-gui"
version.workspace = true
edition.workspace = true

[dependencies]
feral-processes-app-core = { workspace = true }
feral-processes-engine = { workspace = true }

# Trimmed hard rather than taken as `default`, which drags in 3d, pbr,
# gltf, animation and bevy_ui — none of which this frontend renders. The
# screens are drawn through egui and the map is 2d, so what's left is: a
# window, the 2d pipeline, input, and wav playback.
#
# `2d_bevy_render` rather than the `2d` umbrella, and the platform pieces
# spelled out rather than `default_platform`: both umbrellas pull in
# `bevy_gilrs`, whose `libudev-sys` needs a system libudev this game has no
# use for — it has no gamepad support and reads the keyboard only.
# `bevy_audio` + `wav` rather than `audio`, which would add vorbis for
# formats the six embedded cues don't use.
bevy = { version = "0.19", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_log",
    "bevy_asset",
    "bevy_winit",
    "x11",
    "wayland",
    "2d_bevy_render",
    "bevy_audio",
    "wav",
    # Image format decoders are opt-in per format, the same way `wav` is.
    # `assets/sprites/` is PNG and nothing else, so this is the whole of
    # what the map's one-cell sprites cost in the dependency graph — no
    # `image` crate, and no formats the sprites don't use.
    "png",
] }
bevy_egui = "0.41"

# Bevy's own `png` feature (above) is decode-only, so writing a PNG back out
# — the sprite editor's save — needs the encoder named explicitly. Pinned to
# the exact version already in `Cargo.lock` via bevy's own graph, so this
# adds nothing to the dependency graph, only names a crate already there.
image = { version = "0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
fontdue = "0.9"

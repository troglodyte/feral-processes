[package]
name = "feral-processes"
version.workspace = true
edition.workspace = true
# `savetool` and `arena` are this crate's other bins, so a bare `cargo run`
# would be ambiguous without this. The game is what you run; the tool is asked for by
# name. Set here rather than as a workspace `default-members` because that
# would also narrow a bare `cargo test` to this crate, whose only tests
# cover the two dev tools in `[lib]` — the suite would report green having
# run nothing about the game itself.
default-run = "feral-processes"

# Exists only to share `dev_template` between the two bins and give it
# somewhere unit-testable to live. See `src/lib.rs`.
[lib]
name = "feral_processes"
path = "src/lib.rs"

[[bin]]
name = "feral-processes"
path = "src/main.rs"

[[bin]]
name = "savetool"
path = "src/bin/savetool.rs"

[[bin]]
name = "arena"
path = "src/bin/arena.rs"

[[bin]]
name = "train"
path = "src/bin/train.rs"

[dependencies]
feral-processes-app-core = { workspace = true }
feral-processes-engine = { workspace = true }
feral-processes-gui = { workspace = true }
# Already in the lock file at this exact version via the engine, so this
# grows the dependency *graph* by nothing — it is the CEM trainer's source
# of randomness. `rand_distr` is deliberately not here for the one Gaussian
# it would provide; `cem::standard_normal` is three lines of Box-Muller.
rand = "0.10.2"
ron = "0.12.2"
